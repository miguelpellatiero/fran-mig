<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria Fran-Mig</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="galeria.css" />
</head>
<body>
  <!-- Bolhas -->
  <div class="bubbles" id="bubbles"></div>

  <div class="app">
    <!-- Cabeçalho -->
    <div class="brand">
      <div class="mark">galeria <span>fran-mig.</span></div>
      <div class="right">
        <span class="count" id="photoCount">0 fotos</span>
        <button class="logout" id="logoutBtn" title="Sair" aria-label="Sair">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Subtítulo -->
    <div class="meta" style="margin-bottom:24px;">
      <h1 style="font-size:18px; font-weight:400; color:var(--smoke);">Nossas memórias sincronizadas ✨</h1>
    </div>

    <!-- Grid de fotos -->
    <div class="photo-grid" id="photoGrid"></div>

    <!-- Botão adicionar -->
    <div style="display:flex; justify-content:flex-end; margin-top:20px;">
      <button class="add-pill" id="openModalBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Adicionar foto
      </button>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal-card">
      <h2>Nova memória</h2>
      <form id="uploadForm">
        <div class="auth-field">
          <label for="titleInput">Título (opcional)</label>
          <input type="text" id="titleInput" placeholder="Ex: Nosso dia na praia" />
        </div>
        <div class="auth-field">
          <label for="descInput">Descrição (opcional)</label>
          <input type="text" id="descInput" placeholder="O que você sentiu..." />
        </div>
        <div class="auth-field">
          <label for="addedByInput">Adicionada por</label>
          <input type="text" id="addedByInput" placeholder="Seu nome" />
        </div>
        <div class="auth-field">
          <label for="fileInput">Escolha uma imagem</label>
          <input type="file" id="fileInput" accept="image/*" required />
        </div>
        <button type="submit" class="auth-submit" id="submitBtn">Salvar</button>
        <button type="button" id="closeModalBtn" style="background:transparent; border:none; color:var(--smoke-dim); margin-top:8px; cursor:pointer; font-size:13px;">
          Cancelar
        </button>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="galeria.js"></script>
</body>
</html>
